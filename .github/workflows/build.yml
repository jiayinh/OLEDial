name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          chmod +x build.sh
          ./build.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent OLEDial.app OLEDial.zip
          shasum -a 256 OLEDial.zip

      - uses: actions/upload-artifact@v5
        with:
          name: OLEDial-${{ github.run_number }}
          path: build/OLEDial.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/OLEDial.zip
          generate_release_notes: true
